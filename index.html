<!DOCTYPE html>
<html lang="ru">
<head>
<title>Курьеры · Авито</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  :root {
    --bg: #F0F1F4; --card: #FFFFFF; --ink: #21201F; --muted: #7A7D85; --line: #E3E5EA;
    --accent: #FFDB4D; --accent-ink: #21201F; --good: #1F8A4C; --bad: #C2402F; --soft: #F6F7F9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  body { padding: 0 0 96px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 16px 8px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 20px; margin: 0; }
  .upd { color: var(--muted); font-size: 12px; }
  .tabs { display: flex; gap: 6px; margin-top: 10px; background: var(--line); padding: 4px; border-radius: 12px; }
  .tabs button { flex: 1; border: 0; background: transparent; padding: 9px 0; border-radius: 9px;
    font: inherit; font-weight: 600; color: var(--muted); }
  .tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  main { padding: 4px 16px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 12px; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 12px;
    font: inherit; font-size: 14px; color: var(--ink); }
  .chip.on { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .card { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 16px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }
  .card h2 small.pay { font-size: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px 8px; }
  .m b { display: block; font-size: 17px; }
  .m span { color: var(--muted); font-size: 12px; }
  .money { display: flex; justify-content: space-between; border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; gap: 8px; }
  .money .m b { font-size: 16px; }
  .pos { color: var(--good); } .neg { color: var(--bad); }
  .note { color: var(--muted); font-size: 13px; margin: 4px 2px 14px; }
  .cand { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
  .cand .r1 { display: flex; justify-content: space-between; font-weight: 600; }
  .cand .r1 span { color: var(--muted); font-weight: 400; font-size: 13px; }
  .cand .src { color: var(--muted); font-size: 13px; margin: 2px 0 6px; }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--soft); color: var(--muted); }
  .tag.y { background: #E5F4EB; color: var(--good); }
  .tag.n { background: #FBE9E6; color: var(--bad); }
  .tag.a { background: #FFF4C2; color: #6B5600; }
  .cand .cm { font-size: 13px; margin-top: 6px; }
  .fab { position: fixed; right: 16px; bottom: 20px; z-index: 6; border: 0; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; font-size: 16px;
    padding: 15px 22px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  /* форма */
  .sheet { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow-y: auto; display: none; }
  .sheet.open { display: block; }
  .sheet header { display: flex; justify-content: space-between; align-items: center; }
  .x { border: 0; background: var(--line); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; }
  .f { margin-bottom: 14px; }
  .f label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px 2px; }
  .f input, .f select, .f textarea { width: 100%; border: 1px solid var(--line); background: var(--card);
    border-radius: 12px; padding: 12px; font: inherit; font-size: 16px; color: var(--ink); }
  .f textarea { min-height: 70px; resize: vertical; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg .chip { padding: 10px 14px; }
  .save { width: 100%; border: 0; border-radius: 14px; background: var(--ink); color: #fff;
    font: inherit; font-weight: 700; font-size: 16px; padding: 15px; margin: 6px 0 30px; }
  .save:disabled { opacity: .5; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; display: none; max-width: 90%; text-align: center; }
  .loading { opacity: .5; pointer-events: none; }
  [hidden] { display: none !important; }
  .setup { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .setup .box { background: var(--card); border-radius: 18px; padding: 22px; width: 100%; max-width: 460px; }
  .setup p { color: var(--muted); margin: 8px 0 14px; }
  .setup input { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; font-size: 16px; margin-bottom: 12px; }
  .setup .save { margin: 0; }
  .out { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; text-decoration: underline; padding: 10px 0 20px; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .addTop { display: none; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
    font: inherit; font-weight: 700; padding: 9px 16px; cursor: pointer; }
  .tbl { display: none; }
  .sheet .panel { min-height: 100%; background: var(--bg); }
  button, .cand, .tbl tbody tr { cursor: pointer; }

  /* ---------- компьютер ---------- */
  @media (min-width: 900px) {
    body { padding-bottom: 40px; }
    header { padding: 20px 24px 10px; }
    h1 { font-size: 22px; }
    .top .right { display: flex; align-items: center; gap: 14px; }
    .addTop { display: inline-block; }
    .fab { display: none; }
    .tabs { max-width: 360px; }
    main { padding: 4px 24px; }
    #sum.show { display: grid !important; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    #sum .chips, #sum .note { grid-column: 1 / -1; }
    .grid { grid-template-columns: repeat(3, 1fr); }
    .list { display: none; }
    .tbl { display: block; background: var(--card); border-radius: 16px; overflow: auto; }
    .tbl table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .tbl th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 12px 10px;
      border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--card); }
    .tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .tbl tbody tr:hover { background: var(--soft); }
    .tbl td.cmt { color: var(--muted); max-width: 260px; }
    .tbl td.nw { white-space: nowrap; }
    .sheet { background: rgba(33,32,31,.35); padding: 40px 16px; }
    .sheet .panel { min-height: 0; max-width: 560px; margin: 0 auto; border-radius: 18px; overflow: hidden; }
    .sheet .panel header { position: static; }
    .toast { bottom: 30px; }
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top"><h1>Курьеры · Авито</h1><div class="right"><span class="upd" id="upd">загрузка…</span><button class="addTop" onclick="openForm()">+ Кандидат</button></div></div>
  <div class="tabs"><button id="tSum" class="on" onclick="tab('sum')">Сводка</button><button id="tCand" onclick="tab('cand')">Кандидаты</button></div>
</header>

<main id="sum" class="show"></main>
<main id="cand" style="display:none"></main>
</div>

<button class="fab" onclick="openForm()">+ Кандидат</button>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeForm()">
 <div class="panel">
  <header><h1 id="fTitle">Новый кандидат</h1><button class="x" onclick="closeForm()">✕</button></header>
  <main>
    <div class="f"><label>Дата отклика</label><input type="date" id="fDate"></div>
    <div class="f"><label>Город</label><div class="seg" data-f="city"></div>
      <input id="fCity" list="allCities" placeholder="Другой город — начните вводить название" autocomplete="off" style="margin-top:8px">
      <datalist id="allCities"></datalist></div>
    <div class="f"><label>Как будет доставлять</label><div class="seg" data-f="transport"></div></div>
    <div class="f"><label>Откуда</label><div class="seg" data-f="source"></div></div>
    <div class="f"><label>Подходит?</label><div class="seg" data-f="qualified"></div></div>
    <div class="f" id="reasonBox"><label>Почему не подходит</label><input id="fReason" placeholder="например: возраст, конкурент, уже курьер"></div>
    <div class="f"><label>Ссылка отправлена?</label><div class="seg" data-f="linkSent"></div></div>
    <div class="f"><label>Зарегистрировался?</label><div class="seg" data-f="lead"></div></div>
    <div class="f"><label>Статус в Pampadu</label><select id="fStatus"></select></div>
    <div class="f"><label>Заказов за 20 дней</label><input type="number" inputmode="numeric" min="0" id="fOrders"></div>
    <div class="f"><label>Комментарий</label><textarea id="fComment"></textarea></div>
    <button class="save" id="saveBtn" onclick="save()">Сохранить</button>
  </main>
 </div>
</div>

<div class="setup" id="setup" hidden>
  <div class="box">
    <h1>Курьеры · Авито</h1>
    <p>Вставьте ссылку на таблицу. Её нужно ввести один раз на каждом устройстве, дальше страница её запомнит.</p>
    <input id="link" placeholder="https://script.google.com/macros/s/…/exec?app=ваш_ключ" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="save" onclick="connect()">Подключить</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let API = '', KEY = '';
try { const s = JSON.parse(localStorage.getItem('hrPanel') || 'null'); if (s) { API = s.api; KEY = s.key; } } catch (e) {}
const OPTS = {
  city: ['Москва', 'Санкт-Петербург', 'Казань'],
  transport: ['Пешком', 'Вело', 'Авто'],
  source: ['Авито, органика', 'Авито, продвижение', 'Сайт', 'Telegram', 'Другое'],
  qualified: ['Да', 'Нет'], linkSent: ['Да', 'Нет'], lead: ['Да', 'Нет']
};
const STATUSES = ['', 'Ждём обновления', 'Processing', 'Online training', 'Invited to HUB', 'Active', 'Активен1зак', 'Активен5зак', 'Lost'];
let DATA = null, form = {}, editing = null, cityFilter = 'Все';

const $ = id => document.getElementById(id);
const nf = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
const rub = v => (v === '' || v == null) ? '—' : nf.format(Math.round(Number(v))) + ' ₽';
const num = v => (v === '' || v == null) ? '—' : nf.format(Number(v));
const pct = v => (!v) ? '—' : (Number(v) * 100).toFixed(1).replace('.', ',') + '%';
const rubOr = v => Number(v) ? rub(v) : '—';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dmy = s => s ? s.split('-').reverse().join('.') : '';
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 2500); }
function busy(on) { document.body.classList.toggle('loading', on); }

const FN = { appData: 'data', appSave: 'save', appSetPeriod: 'period' };
function call(fn, arg) {
  busy(true);
  const q = new URLSearchParams({ api: FN[fn], key: KEY, t: Date.now() });
  if (fn === 'appSave') q.set('data', JSON.stringify(arg));
  if (fn === 'appSetPeriod') q.set('mode', arg);
  const qs = Array.from(q.entries()).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
  return fetch(API + '?' + qs, { credentials: 'omit', redirect: 'follow' })
    .then(r => r.json())
    .then(r => { busy(false); if (!r.ok) throw new Error(r.error); return r.data; })
    .catch(e => {
      busy(false);
      const m = String(e && e.message || e);
      toast(/Нет доступа/.test(m) ? 'Неверный ключ. Нажмите «Сменить ссылку» и вставьте её заново.' :
            /fetch|NetworkError|JSON/i.test(m) ? 'Таблица не ответила. Проверьте ссылку и что опубликована новая версия скрипта.' : 'Ошибка: ' + m);
      throw e;
    });
}

function parseLink(s) {
  try {
    const u = new URL(s.trim());
    const key = u.searchParams.get('app') || u.searchParams.get('key');
    if (!/script\.google\.com$/.test(u.hostname) || !/\/exec$/.test(u.pathname) || !key) return null;
    return { api: u.origin + u.pathname, key: key };
  } catch (e) { return null; }
}
function connect() {
  const s = parseLink($('link').value);
  if (!s) { toast('Ссылка должна быть вида …/exec?app=ваш_ключ'); return; }
  API = s.api; KEY = s.key;
  call('appData').then(d => {
    try { localStorage.setItem('hrPanel', JSON.stringify(s)); } catch (e) {}
    $('setup').hidden = true; render(d);
  }, () => {});
}
function logout() {
  try { localStorage.removeItem('hrPanel'); } catch (e) {}
  API = KEY = ''; $('link').value = ''; $('setup').hidden = false;
}

function load() {
  if (!API) { $('setup').hidden = false; return; }
  call('appData').then(render, () => {});
}

function tab(t) {
  $('sum').style.display = t === 'sum' ? '' : 'none';
  $('sum').classList.toggle('show', t === 'sum');
  $('cand').style.display = t === 'cand' ? '' : 'none';
  $('tSum').classList.toggle('on', t === 'sum');
  $('tCand').classList.toggle('on', t === 'cand');
  window.scrollTo(0, 0);
}

function render(d) {
  DATA = d;
  if (d.cities && d.cities.active) OPTS.city = d.cities.active;
  $('allCities').innerHTML = ((d.cities && d.cities.all) || OPTS.city).map(c => `<option value="${esc(c)}">`).join('');
  $('upd').textContent = 'обновлено ' + d.updated;
  renderSum(); renderCand();
}

function periodMode() {
  const p = DATA.period, y = new Date(); y.setDate(y.getDate() - 1);
  const ys = new Date(y.getTime() - y.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  if (p.from === '2026-10-24') return 'all';
  if (p.from === ys) return 'yesterday';
  const w = new Date(); w.setDate(w.getDate() - 7);
  const ws = new Date(w.getTime() - w.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  if (p.from === ws) return 'week';
  return '';
}

function renderSum() {
  const p = DATA.period, mode = periodMode();
  let h = '<div class="chips">' +
    [['all', 'С начала теста'], ['week', '7 дней'], ['yesterday', 'Вчера']]
      .map(([m, t]) => `<button class="chip ${mode === m ? 'on' : ''}" onclick="setPeriod('${m}')">${t}</button>`).join('') +
    '</div><div class="note">Период: ' + dmy(p.from) + ' — ' + dmy(p.to) + '. Авито обновляется каждое утро за вчерашний день.</div>';
  DATA.summary.forEach(s => {
    const profitCls = Number(s.profit) > 0 ? 'pos' : Number(s.profit) < 0 ? 'neg' : '';
    h += `<div class="card"><h2><span>${esc(s.city)}${Number(s.pay5) ? `<small class="pay"> · ${rub(s.pay5)} за 5 заказов</small>` : ''}</span><small>потрачено ${rub(s.spend)}</small></h2>
      <div class="grid">
        <div class="m"><b>${num(s.impressions)}</b><span>показы</span></div>
        <div class="m"><b>${num(s.views)}</b><span>просмотры · ${pct(s.ctr)}</span></div>
        <div class="m"><b>${num(s.responses)}</b><span>отклики · ${pct(s.cr)}</span></div>
        <div class="m"><b>${num(s.qualified)}</b><span>подходят</span></div>
        <div class="m"><b>${num(s.leads)}</b><span>регистрации</span></div>
        <div class="m"><b>${num(s.leadsPampadu)}</b><span>по Pampadu</span></div>
        <div class="m"><b>${rubOr(s.cpr)}</b><span>цена отклика</span></div>
        <div class="m"><b>${rubOr(s.cpl)}</b><span>цена регистрации</span></div>
        <div class="m"><b>${num(s.approved)}</b><span>курьеров оплачено</span></div>
      </div>
      <div class="money">
        <div class="m"><b>${rub(s.revenue)}</b><span>начислено</span></div>
        <div class="m"><b class="${profitCls}">${rub(s.profit)}</b><span>прибыль</span></div>
        <div class="m"><b>${rub(s.expected)}</b><span>ожидаем по EPL</span></div>
      </div></div>`;
  });
  $('sum').innerHTML = h + '<button class="out" onclick="logout()">Сменить ссылку</button>';
}

function tagYN(label, v) {
  if (v === 'Да') return `<span class="tag y">${label}</span>`;
  if (v === 'Нет') return `<span class="tag n">${label}: нет</span>`;
  return '';
}

function renderCand() {
  const list = DATA.candidates.filter(c => cityFilter === 'Все' || c.city === cityFilter);
  const fc = ['Все'].concat(OPTS.city);
  DATA.candidates.forEach(c => { if (c.city && fc.indexOf(c.city) < 0) fc.push(c.city); });
  let h = '<div class="chips">' + fc
    .map(c => `<button class="chip ${cityFilter === c ? 'on' : ''}" data-c="${esc(c)}" onclick="filterCity(this.dataset.c)">${esc(c)}</button>`).join('') + '</div>';
  if (!list.length) { $('cand').innerHTML = h + '<div class="empty">Пока никого. Нажмите «+ Кандидат».</div>'; return; }
  const yn = v => v === 'Да' ? '<span class="tag y">Да</span>' : v === 'Нет' ? '<span class="tag n">Нет</span>' : '';
  let t = '<div class="tbl"><table><thead><tr><th>Дата</th><th>Город</th><th>Откуда</th><th>Подходит</th><th>Причина</th><th>Доставка</th>' +
    '<th>Ссылка</th><th>Регистрация</th><th>Статус Pampadu</th><th>Заказов</th><th>Начислено</th><th>Комментарий</th></tr></thead><tbody>';
  list.forEach(c => {
    t += `<tr onclick="openForm(${c.row})"><td class="nw">${dmy(c.date)}</td><td class="nw">${esc(c.city)}</td><td class="nw">${esc(c.source)}</td>
      <td>${yn(c.qualified)}</td><td>${esc(c.reason)}</td><td class="nw">${esc(c.transport)}</td><td>${yn(c.linkSent)}</td><td>${yn(c.lead)}</td>
      <td class="nw">${c.status ? `<span class="tag a">${esc(c.status)}</span>` : ''}</td><td>${esc(c.orders)}</td>
      <td class="nw">${Number(c.payout) ? rub(c.payout) : ''}</td><td class="cmt">${esc(c.comment)}</td></tr>`;
  });
  h += t + '</tbody></table></div><div class="list">';
  list.forEach(c => {
    h += `<div class="cand" onclick="openForm(${c.row})">
      <div class="r1">${esc(c.city || '—')}<span>${dmy(c.date)}</span></div>
      <div class="src">${esc(c.source)}${c.transport ? ' · ' + esc(c.transport).toLowerCase() : ''}${c.reason ? ' · ' + esc(c.reason) : ''}</div>
      <div class="tags">${tagYN('подходит', c.qualified)}${tagYN('ссылка', c.linkSent)}${tagYN('регистрация', c.lead)}
        ${c.status ? `<span class="tag a">${esc(c.status)}</span>` : ''}
        ${c.orders !== '' ? `<span class="tag">заказов: ${esc(c.orders)}</span>` : ''}
        ${Number(c.payout) ? `<span class="tag y">${rub(c.payout)}</span>` : ''}</div>
      ${c.comment ? `<div class="cm">${esc(c.comment)}</div>` : ''}
    </div>`;
  });
  $('cand').innerHTML = h + '</div>';
}

function filterCity(c) { cityFilter = c; renderCand(); }
function setPeriod(m) { call('appSetPeriod', m).then(render); }

/* ---------- форма ---------- */
function drawSeg() {
  document.querySelectorAll('.seg').forEach(el => {
    const f = el.dataset.f;
    el.innerHTML = OPTS[f].map(o => `<button type="button" class="chip ${form[f] === o ? 'on' : ''}" data-v="${esc(o)}">${esc(o)}</button>`).join('');
    el.querySelectorAll('button').forEach(b => b.onclick = () => {
      form[f] = form[f] === b.dataset.v ? '' : b.dataset.v;
      if (f === 'city') $('fCity').value = form.city;
      drawSeg();
    });
  });
  $('reasonBox').style.display = form.qualified === 'Нет' ? '' : 'none';
}

function openForm(row) {
  const c = row ? DATA.candidates.find(x => x.row === row) : null;
  editing = c ? c.row : null;
  form = c ? { city: c.city, source: c.source, qualified: c.qualified, linkSent: c.linkSent, lead: c.lead, transport: c.transport }
           : { city: cityFilter !== 'Все' ? cityFilter : '', source: 'Авито, органика', qualified: '', linkSent: '', lead: '', transport: 'Пешком' };
  $('fCity').value = form.city || '';
  $('fTitle').textContent = c ? 'Кандидат' : 'Новый кандидат';
  $('fDate').value = c ? c.date : today();
  $('fReason').value = c ? c.reason : '';
  $('fStatus').innerHTML = STATUSES.map(s => `<option ${c && c.status === s ? 'selected' : ''}>${esc(s)}</option>`).join('');
  $('fOrders').value = c && c.orders !== '' ? c.orders : '';
  $('fComment').value = c ? c.comment : '';
  drawSeg();
  $('sheet').classList.add('open');
  $('sheet').scrollTop = 0;
}
$('fCity').addEventListener('input', () => { form.city = $('fCity').value.trim(); drawSeg(); });
function closeForm() { $('sheet').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeForm(); });

function save() {
  form.city = $('fCity').value.trim();
  const all = (DATA.cities && DATA.cities.all) || OPTS.city;
  if (!form.city) { toast('Выберите город'); return; }
  const hit = all.find(x => x.toLowerCase() === form.city.toLowerCase());
  if (!hit) { toast('Такого города нет в списке Pampadu — выберите из подсказок'); return; }
  form.city = hit;
  const c = Object.assign({}, form, {
    row: editing, date: $('fDate').value,
    reason: form.qualified === 'Нет' ? $('fReason').value.trim() : '',
    status: $('fStatus').value, orders: $('fOrders').value, comment: $('fComment').value.trim()
  });
  $('saveBtn').disabled = true;
  call('appSave', c).then(d => {
    $('saveBtn').disabled = false; closeForm(); render(d); tab('cand'); toast('Сохранено в таблицу');
  }, () => { $('saveBtn').disabled = false; });
}

load();
</script>
</body>
</html>
